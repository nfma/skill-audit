name: Dependency audit

# Two independent advisory sources, both acted on.
#
# `npm audit` resolves the committed lockfile — including the `overrides` block —
# so it is the only one of the two that can judge a pull request's own tree.
#
# Dependabot alerts are computed by GitHub against the *default branch*, not
# against a pull request head, so running that check on a pull request would
# report on `main` rather than on the change under review. It therefore runs on
# pushes to `main` and on a weekly schedule, where it is measuring the thing it
# actually describes.
#
# Neither source subsumes the other: `npm audit` reads clean on a tree whose
# transitive dependencies are pinned by `overrides`, while Dependabot continues
# to raise alerts against the manifest ranges. Both must be clean.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: skill-audit
        run: npm ci --ignore-scripts

      # Threshold is `low` deliberately: Dependabot reports every severity, and a
      # higher threshold here would leave a gap between the two sources.
      - name: Audit resolved dependency tree
        working-directory: skill-audit
        run: npm audit --audit-level=low

  dependabot-alerts:
    name: GitHub Dependabot alerts
    # Alerts describe the default branch, so this is meaningless on a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Require no open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fail closed: if the alert list cannot be read at all, treat that as a
          # failure rather than silently reporting success.
          if ! alerts=$(gh api \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            2>&1); then
            echo "Could not read Dependabot alerts:" >&2
            echo "$alerts" >&2
            echo >&2
            echo "If this is a permissions error, the workflow token cannot read" >&2
            echo "Dependabot alerts; supply a token with the security_events scope." >&2
            exit 1
          fi

          count=$(printf '%s' "$alerts" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No open Dependabot alerts."
            exit 0
          fi

          echo "$count open Dependabot alert(s):" >&2
          printf '%s' "$alerts" | jq -r '.[]
            | "  \(.security_advisory.severity)\t\(.dependency.package.name)\t\(.dependency.scope)\tfixed in \(.security_vulnerability.first_patched_version.identifier // "no patch available")"' >&2
          exit 1
