name: Dependency audit

# Two independent advisory sources, both enforced on pull requests.
#
# `npm audit` resolves the committed lockfile — including the `overrides` block —
# and checks the complete resolved dependency tree against npm advisories.
#
# GitHub's dependency review compares the pull request dependency graph with its
# base and rejects newly introduced vulnerabilities using the GitHub Advisory
# Database. Dependabot alerts and update PRs continue monitoring the default
# branch after merge.
#
# Neither source subsumes the other, so both pull-request checks must pass.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: skill-audit
        run: npm ci --ignore-scripts

      # Threshold is `low` deliberately: Dependabot reports every severity, and a
      # higher threshold here would leave a gap between the two sources.
      - name: Audit resolved dependency tree
        working-directory: skill-audit
        run: npm audit --audit-level=low

  dependency-review:
    name: GitHub dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
