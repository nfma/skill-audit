name: Dependency audit

# Two independent advisory sources, both enforced on pull requests.
#
# `npm audit` resolves the committed lockfile — including the `overrides` block —
# and checks the complete resolved dependency tree against npm advisories.
#
# GitHub's dependency review compares the pull request dependency graph with its
# base and rejects newly introduced vulnerabilities using the GitHub Advisory
# Database. Dependabot alerts monitor the default branch after merge.
#
# Neither source subsumes the other, so both pull-request checks must pass.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: skill-audit
        run: npm ci --ignore-scripts

      # Threshold is `low` deliberately: Dependabot reports every severity, and a
      # higher threshold here would leave a gap between the two sources.
      - name: Audit resolved dependency tree
        working-directory: skill-audit
        run: npm audit --audit-level=low

  dependency-review:
    name: GitHub dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  dependabot-alerts:
    name: GitHub Dependabot alerts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dependabot-alerts
    timeout-minutes: 10
    steps:
      - name: Require no open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Dependabot alerts were NOT checked: DEPENDABOT_ALERTS_TOKEN is not set."
            echo "::warning::Add a token with Dependabot-alerts read access to enable this check."
            echo "Dependabot alert check did not run: DEPENDABOT_ALERTS_TOKEN is not configured."
            echo "This is not a clean result — it is an unchecked one."
            exit 0
          fi

          if ! alerts=$(gh api \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            2>&1); then
            echo "Could not read Dependabot alerts:" >&2
            echo "$alerts" >&2
            echo >&2
            echo "DEPENDABOT_ALERTS_TOKEN is set but cannot read the alerts API;" >&2
            echo "it most likely lacks Dependabot-alerts read access." >&2
            exit 1
          fi

          count=$(printf '%s' "$alerts" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No open Dependabot alerts."
            exit 0
          fi

          echo "$count open Dependabot alert(s):" >&2
          printf '%s' "$alerts" | jq -r '.[]
            | "  \(.security_advisory.severity)\t\(.dependency.package.name)\t\(.dependency.scope)\t"
              + "fixed in \(.security_vulnerability.first_patched_version.identifier // "no patch available")"' >&2
          exit 1
