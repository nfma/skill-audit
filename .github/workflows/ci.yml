name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: skill-audit/package-lock.json

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci --ignore-scripts

      - name: Run tests
        working-directory: ./skill-audit
        run: npm test

      - name: Build
        working-directory: ./skill-audit
        run: npm run build

      - name: Test CLI
        working-directory: ./skill-audit
        run: node dist/cli.js --help

      - name: Run lint mode (smoke test)
        working-directory: ./skill-audit
        run: node dist/cli.js --mode lint --path . --json > /dev/null
