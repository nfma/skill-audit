name: Security

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-and-secrets:
    name: Semgrep and Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true

      - name: Install pinned Gitleaks
        run: |
          ./skill-audit/scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Run full Semgrep scan
        run: |
          report="$RUNNER_TEMP/semgrep-results.json"
          uvx --no-build --from semgrep==1.173.0 semgrep scan \
            --config p/default \
            --config p/security-audit \
            --metrics=off \
            --exclude skill-audit/node_modules \
            --exclude skill-audit/dist \
            --json-output "$report" \
            .
          node skill-audit/scripts/check-semgrep.mjs \
            --report "$report" \
            --baseline .semgrep-baseline.json \
            --repo-root .

      - name: Scan Git history for secrets
        run: gitleaks git --redact --verbose .

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Scan dependencies and secrets
        run: >-
          trivy fs
          --scanners vuln,secret
          --severity MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --skip-dirs skill-audit/node_modules
          --skip-dirs skill-audit/dist
          .
