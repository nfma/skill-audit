name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-and-secrets:
    name: Semgrep and Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true

      - name: Install pinned Gitleaks
        run: |
          ./skill-audit/scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Run Semgrep on changed code
        if: github.event_name != 'schedule'
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline_commit=$PULL_REQUEST_BASE
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            baseline_commit=$PUSH_BEFORE
          else
            baseline_commit=$(git rev-parse HEAD^)
          fi

          uvx --from semgrep==1.173.0 semgrep scan \
            --config p/default \
            --config p/security-audit \
            --baseline-commit "$baseline_commit" \
            --error \
            --metrics=off \
            --exclude skill-audit/node_modules \
            --exclude skill-audit/dist \
            .

      - name: Scan Git history for secrets
        run: gitleaks git --redact --verbose .

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Scan dependencies, configuration, and secrets
        run: >-
          trivy fs
          --scanners vuln,misconfig,secret
          --severity MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --skip-dirs skill-audit/node_modules
          --skip-dirs skill-audit/dist
          .
