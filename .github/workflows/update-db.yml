name: Update Vulnerability DB

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-db:
    name: Update vulnerability feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: skill-audit/package-lock.json

      - name: Restore vulnerability feed cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: skill-audit/.cache/skill-audit
          key: vuln-db-feeds-${{ github.run_id }}
          restore-keys: |
            vuln-db-feeds-

      - name: Install dependencies
        working-directory: ./skill-audit
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: ./skill-audit
        run: npm run build

      - name: Update vulnerability feeds
        working-directory: ./skill-audit
        run: npm run security:update
