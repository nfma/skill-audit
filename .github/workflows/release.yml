name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact_name }}
      executable-sha256: ${{ steps.identity.outputs.executable_sha256 }}
      descriptor-sha256: ${{ steps.identity.outputs.descriptor_sha256 }}
      checksum-sha256: ${{ steps.identity.outputs.checksum_sha256 }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify tag, source commit, and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
          test "v$(node -p 'require("./skill-audit/package.json").version')" = "$RELEASE_TAG"

      - name: Install dependencies
        working-directory: skill-audit
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: skill-audit
        run: npm test

      - name: Type-check
        working-directory: skill-audit
        run: npm run typecheck

      - name: Build development output
        working-directory: skill-audit
        run: npm run build

      - name: Build release assets exactly once
        working-directory: skill-audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build:release

      - name: Verify staged release assets
        working-directory: skill-audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run verify:release

      - name: Record exact release identities
        id: identity
        working-directory: skill-audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          executable="release/skill-audit-$RELEASE_TAG.mjs"
          descriptor="release/skill-audit-$RELEASE_TAG-release.json"
          checksum="$executable.sha256"
          {
            echo "artifact_name=skill-audit-release-$SOURCE_COMMIT"
            echo "executable_sha256=$(sha256sum "$executable" | cut -d ' ' -f 1)"
            echo "descriptor_sha256=$(sha256sum "$descriptor" | cut -d ' ' -f 1)"
            echo "checksum_sha256=$(sha256sum "$checksum" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the immutable handoff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: skill-audit/release/*
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate exact bytes (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install verification dependencies
        working-directory: skill-audit
        run: npm ci --ignore-scripts

      - name: Build file-backed development modules
        working-directory: skill-audit
        run: npm run build

      - name: Download the exact handoff artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: skill-audit/release

      - name: Verify recorded artifact identities
        working-directory: skill-audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_EXECUTABLE_SHA256: ${{ needs.build.outputs.executable-sha256 }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.build.outputs.descriptor-sha256 }}
          EXPECTED_CHECKSUM_SHA256: ${{ needs.build.outputs.checksum-sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const digest = path => createHash("sha256").update(readFileSync(path)).digest("hex");
          const executable = `release/skill-audit-${process.env.RELEASE_TAG}.mjs`;
          const descriptor = `release/skill-audit-${process.env.RELEASE_TAG}-release.json`;
          if (digest(executable) !== process.env.EXPECTED_EXECUTABLE_SHA256) process.exit(1);
          if (digest(descriptor) !== process.env.EXPECTED_DESCRIPTOR_SHA256) process.exit(1);
          if (digest(`${executable}.sha256`) !== process.env.EXPECTED_CHECKSUM_SHA256) process.exit(1);
          NODE

      - name: Verify executable behavior and descriptor
        working-directory: skill-audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run verify:release

  attest:
    name: Attest exact release subjects
    needs: [build, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Mint the OIDC token used for artifact attestations.
      attestations: write # Publish attestations for the validated subjects.
      artifact-metadata: write # Associate attestation metadata with the artifacts.
    steps:
      - name: Download the exact handoff artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release

      - name: Attest executable and descriptor provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.mjs
            release/*-release.json

  publish:
    name: Publish the validated GitHub Release
    needs: [build, validate, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write # Create and publish the immutable GitHub Release.
    steps:
      - name: Download the exact handoff artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release

      - name: Reverify exact bytes before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_EXECUTABLE_SHA256: ${{ needs.build.outputs.executable-sha256 }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.build.outputs.descriptor-sha256 }}
          EXPECTED_CHECKSUM_SHA256: ${{ needs.build.outputs.checksum-sha256 }}
        run: |
          set -euo pipefail
          executable="release/skill-audit-$RELEASE_TAG.mjs"
          descriptor="release/skill-audit-$RELEASE_TAG-release.json"
          test "$(sha256sum "$executable" | cut -d ' ' -f 1)" = "$EXPECTED_EXECUTABLE_SHA256"
          test "$(sha256sum "$descriptor" | cut -d ' ' -f 1)" = "$EXPECTED_DESCRIPTOR_SHA256"
          test "$(sha256sum "$executable.sha256" | cut -d ' ' -f 1)" = "$EXPECTED_CHECKSUM_SHA256"

      - name: Create the complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/skill-audit-$RELEASE_TAG.mjs" \
            "release/skill-audit-$RELEASE_TAG.mjs.sha256" \
            "release/skill-audit-$RELEASE_TAG-release.json" \
            --draft \
            --generate-notes \
            --title "$RELEASE_TAG" \
            --verify-tag

      - name: Verify uploaded draft asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_EXECUTABLE_SHA256: ${{ needs.build.outputs.executable-sha256 }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.build.outputs.descriptor-sha256 }}
          EXPECTED_CHECKSUM_SHA256: ${{ needs.build.outputs.checksum-sha256 }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release-draft.json"
          max_attempts=6
          sleep_seconds=1
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$release_json"; then
              validator_exit=0
              ATTEMPT="$attempt" MAX_ATTEMPTS="$max_attempts" RELEASE_JSON="$release_json" node --input-type=module <<'NODE' || validator_exit=$?
          import { readFileSync } from "node:fs";

          const attempt = `attempt ${process.env.ATTEMPT}/${process.env.MAX_ATTEMPTS}`;
          const annotation = process.env.ATTEMPT === process.env.MAX_ATTEMPTS ? "error" : "warning";
          const observed = (value) => JSON.stringify(value) ?? String(value);
          const fail = (label, actual, expected) => {
            console.error(`::${annotation}::${attempt}: ${label}; observed=${observed(actual)} expected=${observed(expected)}`);
            process.exit(1);
          };
          const releases = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8")).flat();
          const matches = releases.filter(release => release.tag_name === process.env.RELEASE_TAG);
          if (matches.length !== 1) {
            fail(
              "release enumeration match count",
              { count: matches.length, releaseIds: matches.map(release => release.id) },
              { count: 1 },
            );
          }
          const [release] = matches;
          const expected = new Map([
            [`skill-audit-${process.env.RELEASE_TAG}.mjs`, `sha256:${process.env.EXPECTED_EXECUTABLE_SHA256}`],
            [`skill-audit-${process.env.RELEASE_TAG}.mjs.sha256`, `sha256:${process.env.EXPECTED_CHECKSUM_SHA256}`],
            [`skill-audit-${process.env.RELEASE_TAG}-release.json`, `sha256:${process.env.EXPECTED_DESCRIPTOR_SHA256}`],
          ]);
          if (release.draft !== true) fail("release draft state", release.draft, true);
          if (!Array.isArray(release.assets)) fail("release assets type", release.assets, "array");
          if (release.assets.length !== expected.size) {
            fail("release asset count", release.assets.length, expected.size);
          }
          for (const asset of release.assets) {
            const expectedDigest = expected.get(asset.name);
            if (expectedDigest === undefined) {
              fail("release asset name", asset.name, [...expected.keys()]);
            }
            if (asset.state !== "uploaded") fail(`asset ${asset.name} state`, asset.state, "uploaded");
            if (asset.digest !== expectedDigest) fail(`asset ${asset.name} digest`, asset.digest, expectedDigest);
            expected.delete(asset.name);
          }
          if (expected.size !== 0) fail("missing release assets", [...expected.keys()], []);
          NODE
              if ((validator_exit == 0)); then
                echo "attempt $attempt/$max_attempts: draft release asset verification succeeded"
                break
              fi
            else
              api_exit=$?
              annotation=warning
              if ((attempt == max_attempts)); then annotation=error; fi
              echo "::$annotation::attempt $attempt/$max_attempts: release enumeration API failed; observed_exit=$api_exit expected_exit=0" >&2
            fi
            if ((attempt == max_attempts)); then
              echo "::error::draft release asset verification failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "attempt $attempt/$max_attempts: retrying with fresh release data in ${sleep_seconds}s" >&2
            sleep "$sleep_seconds"
            sleep_seconds=$((sleep_seconds * 2))
          done

      - name: Publish and confirm the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          release_json="$RUNNER_TEMP/release-published.json"
          max_attempts=6
          sleep_seconds=1
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json"; then
              validator_exit=0
              ATTEMPT="$attempt" MAX_ATTEMPTS="$max_attempts" RELEASE_JSON="$release_json" node --input-type=module <<'NODE' || validator_exit=$?
          import { readFileSync } from "node:fs";

          const attempt = `attempt ${process.env.ATTEMPT}/${process.env.MAX_ATTEMPTS}`;
          const annotation = process.env.ATTEMPT === process.env.MAX_ATTEMPTS ? "error" : "warning";
          const release = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8"));
          const observed = (value) => JSON.stringify(value) ?? String(value);
          const fail = (label, actual, expected) => {
            console.error(`::${annotation}::${attempt}: ${label}; observed=${observed(actual)} expected=${observed(expected)}`);
            process.exit(1);
          };
          if (release.tag_name !== process.env.RELEASE_TAG) {
            fail("published release tag", release.tag_name, process.env.RELEASE_TAG);
          }
          if (release.draft !== false) fail("published release draft state", release.draft, false);
          if (release.immutable !== true) fail("published release immutable state", release.immutable, true);
          if (!Array.isArray(release.assets)) fail("published release assets type", release.assets, "array");
          if (release.assets.length !== 3) fail("published release asset count", release.assets.length, 3);
          NODE
              if ((validator_exit == 0)); then
                echo "attempt $attempt/$max_attempts: published release verification succeeded"
                break
              fi
            else
              api_exit=$?
              annotation=warning
              if ((attempt == max_attempts)); then annotation=error; fi
              echo "::$annotation::attempt $attempt/$max_attempts: published release lookup failed; observed_exit=$api_exit expected_exit=0" >&2
            fi
            if ((attempt == max_attempts)); then
              echo "::error::published release verification failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "attempt $attempt/$max_attempts: retrying with fresh published release data in ${sleep_seconds}s" >&2
            sleep "$sleep_seconds"
            sleep_seconds=$((sleep_seconds * 2))
          done
