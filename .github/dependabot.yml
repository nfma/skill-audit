version: 2

updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/skill-audit"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    reviewers:
      - "nfma"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "nfma"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
