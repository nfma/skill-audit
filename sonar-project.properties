sonar.organization=nfma
sonar.projectKey=nfma_skill-audit
sonar.projectName=skill-audit
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=.github,skill-audit/src,skill-audit/scripts
sonar.tests=skill-audit/src,skill-audit/test
sonar.test.inclusions=skill-audit/src/**/*.test.ts,skill-audit/test/**/*.test.ts
sonar.exclusions=skill-audit/src/**/*.test.ts,skill-audit/dist/**,skill-audit/node_modules/**,skill-audit/coverage/**
sonar.javascript.lcov.reportPaths=skill-audit/coverage/lcov.info
# These CLI scripts are covered through child-process integration tests, which
# cannot be attributed to the parent Vitest lcov report.
sonar.coverage.exclusions=skill-audit/src/index.ts,skill-audit/scripts/baseline-cli.mjs,skill-audit/scripts/check-self-audit.mjs,skill-audit/scripts/check-format.mjs,skill-audit/scripts/check-semgrep.mjs
sonar.typescript.tsconfigPaths=skill-audit/tsconfig.json
